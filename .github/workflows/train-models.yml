name: Train Retzef Models

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/corpora/**"
      - "scripts/train-models.js"
      - "package.json"
      - ".github/workflows/train-models.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Train model family
        run: npm run train:models
      - name: Upload trained model files
        uses: actions/upload-artifact@v4
        with:
          name: retzef-brain-models
          path: models/*.json
          if-no-files-found: error
          retention-days: 30
