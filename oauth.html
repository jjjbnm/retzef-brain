<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Retzef Brain · Developer Console</title><link rel="stylesheet" href="/styles.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}.oauth-page{background:#090b12;color:#f4f5fb}.topbar{position:sticky;top:0;z-index:5;background:#0b0e18ed;backdrop-filter:blur(18px);border-bottom:1px solid #272d40;padding:14px max(20px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:11px;align-items:center;color:#fff;text-decoration:none;font-weight:900;letter-spacing:1px}.brand-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#9a79ff,#6545d6);font-size:21px}.brand small{display:block;font-size:9px;color:#9da6bd;letter-spacing:2px}.btn{padding:10px 15px;border-radius:10px;background:#222a3c;color:#fff;text-decoration:none;border:1px solid #343d54}.oauth-dashboard{max-width:1180px;margin:32px auto 90px;padding:0 20px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin:28px 0}.kicker{font-size:11px;color:#ae9cff;font-weight:800;letter-spacing:2px}.hero h1{font-size:clamp(32px,5vw,48px);margin:9px 0}.hero p,.muted{color:#a6adc0;line-height:1.7}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:20px;align-items:start}.panel{background:#111522;border:1px solid #30364a;border-radius:17px;padding:20px;margin-bottom:16px;box-shadow:0 16px 50px #0002}.panel h2{font-size:19px;margin:0 0 14px}.side{position:sticky;top:82px}.app-item{width:100%;text-align:right;background:#0c111d;color:#fff;border:1px solid #30364a;border-radius:12px;padding:13px;margin:7px 0;cursor:pointer}.app-item.active{border-color:#9178ff;background:#211b39}.app-item small{display:block;color:#9da6bd;margin-top:5px}.field{display:grid;gap:7px;margin:13px 0;color:#c9cde0;font-size:13px}.field input,.field textarea,.field select{width:100%;background:#090d17;border:1px solid #343b50;color:#fff;border-radius:10px;padding:12px;font:inherit;min-width:0}.field textarea{min-height:92px}.ltr{direction:ltr;text-align:left}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary,.secondary,.danger{border:0;border-radius:10px;padding:11px 15px;color:#fff;font-weight:750;cursor:pointer}.primary{background:#8066ed}.secondary{background:#293247}.danger{background:#713b48}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.section-title{font-size:15px;font-weight:850;border-bottom:1px solid #2d3448;padding-bottom:11px;margin:22px 0 12px}.mono{direction:ltr;text-align:left;overflow-wrap:anywhere;background:#080c14;border:1px solid #272e40;border-radius:9px;padding:11px;font:12px ui-monospace,monospace}.secret{border:1px solid #8d76ff;background:#211b39;padding:15px;border-radius:13px;margin:15px 0}.checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.check{display:flex;align-items:center;gap:9px;background:#0b101c;border:1px solid #2c3448;border-radius:10px;padding:10px}.check input{accent-color:#8b72ff}.pill{display:inline-block;border:1px solid #514579;color:#c6b9ff;background:#211b39;border-radius:99px;padding:4px 9px;font-size:11px}.status{color:#b8a9ff;min-height:22px;margin:10px 0}.empty{padding:26px;text-align:center;color:#9da6bd;border:1px dashed #343b50;border-radius:12px}.icon-preview{width:64px;height:64px;object-fit:cover;border-radius:14px;background:#252b3c;border:1px solid #39415a}.history-row{padding:10px 0;border-bottom:1px solid #2b3245;color:#c3c9d9;font-size:13px}.hidden{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static}.grid2{grid-template-columns:1fr}.oauth-dashboard{padding:0 13px}.panel{padding:16px}.topbar{padding:12px 14px}}
</style></head><body class="oauth-page"><header class="topbar"><a class="brand" href="/"><span class="brand-icon">R</span><span>RETZEF <b>BRAIN</b><small>DEVELOPER CONSOLE</small></span></a><a class="btn" href="/">חזרה לאתר</a></header><main class="oauth-dashboard"><section class="hero"><div><div class="kicker">AUTHENTICATION · APP MANAGEMENT</div><h1>App <span style="color:#a995ff">Details</span></h1><p>נהל את האפליקציות, פרטי OAuth, הרשאות והגדרות הפרסום שלך במקום אחד.</p></div><span class="pill">OAuth 2.0 · Authorization Code + PKCE</span></section><div class="layout"><aside class="side"><section class="panel"><h2>האפליקציות שלי</h2><div id="apps"><div class="empty">טוען…</div></div><div class="section-title">יצירת אפליקציה</div><form id="createForm"><label class="field">App name *<input name="name" maxlength="50" placeholder="My Retzef App" required></label><label class="field">Redirect URI *<textarea class="ltr" name="redirect" placeholder="https://example.com/oauth/callback" required></textarea></label><button class="primary" type="submit">＋ יצירת OAuth App</button></form><div id="createMsg" class="status"></div></section></aside><section id="editor"><div class="panel empty">בחר אפליקציה מהרשימה או צור אפליקציה חדשה כדי לערוך את הפרטים שלה.</div></section></div></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let apps=[],selected=null,iconDraft='';
async function api(action,opts={}){const r=await fetch('/api/account?action=oauth-'+action,{credentials:'same-origin',cache:'no-store',...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'הפעולה נכשלה');return d}
const val=(o,k)=>esc(o?.[k]||'');function renderApps(){ $('#apps').innerHTML=apps.length?apps.map(a=>`<button class="app-item ${selected?.clientId===a.clientId?'active':''}" data-id="${esc(a.clientId)}"><b>${esc(a.name)}</b><small>${esc(a.clientId.slice(0,24))}…</small><small>${esc(a.details?.status||'Draft')}</small></button>`).join(''):'<div class="empty">עדיין אין אפליקציות</div>';$('#apps').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>selectApp(b.dataset.id));}
async function loadApps(keep){const d=await api('apps');apps=d.apps||[];renderApps();if(keep&&selected){const a=apps.find(x=>x.clientId===selected.clientId);if(a)selectApp(a.clientId);else selected=null;}}
function checkedGroup(title,name,items,chosen){return `<div class="field"><b>${title}</b><div class="checkgrid">${items.map(x=>`<label class="check"><input type="checkbox" name="${name}" value="${esc(x)}" ${(chosen||[]).includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div></div>`}
function renderEditor(a){const d=a.details||{};iconDraft=d.iconData||'';const icon=iconDraft||'';$('#editor').innerHTML=`<section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><div class="kicker">APP DETAILS</div><h2 style="font-size:25px;margin:7px 0">${esc(a.name)}</h2><span class="pill">${esc(d.status||'Draft')}</span></div><button class="danger" id="revoke">ביטול האפליקציה</button></div><div class="section-title">Credentials</div><div class="grid2"><div><label class="field">Client key</label><div class="mono">${esc(a.clientId)}</div><button class="secondary" data-copy="${esc(a.clientId)}">העתקת Client ID</button></div><div><label class="field">Client secret</label><div class="mono">••••••••••••••••••••••••</div><small class="muted">ה־Secret מוצג רק בזמן יצירת האפליקציה.</small></div></div><div class="section-title">Basic information</div><div class="grid2"><div><label class="field">App icon * <input id="iconFile" type="file" accept="image/png,image/jpeg"></label><img class="icon-preview" id="iconPreview" src="${icon}" alt="App icon preview" ${icon?'':'hidden'}><small class="muted">1024×1024 מומלץ · PNG/JPEG · עד 5MB</small></div><div><label class="field">App name *<input id="appName" maxlength="50" value="${esc(a.name)}"></label><label class="field">Category *<select id="category">${['Others','Social','Education','Entertainment','Productivity','Business','Developer Tools','Games'].map(x=>`<option ${d.category===x?'selected':''}>${x}</option>`).join('')}</select></label></div></div><label class="field">Description * <textarea id="description" maxlength="120" placeholder="תאר מה האפליקציה עושה…">${val(d,'description')}</textarea><small class="muted"><span id="descCount">${(d.description||'').length}</span> / 120</small></label><div class="grid2"><label class="field">Terms of Service URL *<input class="ltr" id="termsUrl" value="${val(d,'termsUrl')}" placeholder="https://example.com/terms"></label><label class="field">Privacy Policy URL *<input class="ltr" id="privacyUrl" value="${val(d,'privacyUrl')}" placeholder="https://example.com/privacy"></label></div><div class="section-title">Platforms</div>${checkedGroup('Platforms','platforms',['Web','Desktop','Android','iOS'],d.platforms||['Web'])}<div class="section-title">Configure for Web/Desktop</div><label class="field">Web/Desktop URL *<input class="ltr" id="websiteUrl" value="${val(d,'websiteUrl')}" placeholder="https://example.com"></label><label class="field">Redirect URI * <small class="muted">עד 10 כתובות, אחת בכל שורה</small><textarea class="ltr" id="redirects">${(a.redirectUris||[]).join('\n')}</textarea></label><div class="section-title">App review</div><label class="field">Required information for app submission · הסבר על כל מוצר והרשאה<textarea id="reviewText" maxlength="1000" placeholder="הסבר כיצד כל מוצר והרשאה משמשים באפליקציה…">${val(d,'reviewText')}</textarea><small class="muted">עד 1000 תווים. אין כאן שליחה אוטומטית לבדיקה חיצונית.</small></label><div class="section-title">Products</div>${checkedGroup('Products','products',['Login Kit','Display API','Share Kit','Content Posting API'],d.products||['Login Kit'])}<div class="section-title">Scopes</div>${checkedGroup('Scopes','scopes',['user.info.basic','user.info.profile','user.info.stats','video.list','video.upload','video.publish'],d.scopes||['user.info.basic'])}<div class="section-title">Roles & Access</div><div class="history-row">${esc(d.roles?.[0]?.email||'בעל החשבון')} · <b>Owner</b> · <span class="pill">Joined</span></div><div class="section-title">Version & status</div><div class="grid2"><label class="field">Version name<input id="version" maxlength="40" value="${val(d,'version')||'Draft'}" placeholder="Version 1"></label><label class="field">Status<select id="status"><option ${d.status==='Draft'?'selected':''}>Draft</option><option ${d.status==='In review'?'selected':''}>In review</option><option ${d.status==='Live'?'selected':''}>Live</option></select></label></div><div class="actions"><button class="primary" id="save">שמירת שינויים</button><button class="secondary" id="historyBtn">History</button></div><div id="saveMsg" class="status"></div><div id="history"></div></section>`;
$('#description').oninput=e=>$('#descCount').textContent=e.target.value.length;$('#iconFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('הקובץ גדול מ־5MB');e.target.value='';return}if(!['image/png','image/jpeg'].includes(f.type)){alert('יש לבחור PNG או JPEG');e.target.value='';return}iconDraft=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});$('#iconPreview').src=iconDraft;$('#iconPreview').hidden=false;};
$('#save').onclick=saveApp;$('#historyBtn').onclick=loadHistory;$('#revoke').onclick=async()=>{if(!confirm('לבטל את האפליקציה? כל האסימונים שלה יבוטלו.'))return;try{await api('apps',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:a.clientId})});selected=null;await loadApps(false);$('#editor').innerHTML='<div class="panel empty">האפליקציה בוטלה.</div>';}catch(e){alert(e.message)}};$('#editor').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy).then(()=>b.textContent='הועתק!').catch(()=>{}));}
function getChecks(n){return [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value)}
async function saveApp(){const a=selected;if(!a)return;const name=$('#appName').value.trim(),redirectUris=$('#redirects').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),details={category:$('#category').value,description:$('#description').value,iconData:iconDraft,termsUrl:$('#termsUrl').value.trim(),privacyUrl:$('#privacyUrl').value.trim(),websiteUrl:$('#websiteUrl').value.trim(),platforms:getChecks('platforms'),reviewText:$('#reviewText').value,products:getChecks('products'),scopes:getChecks('scopes'),version:$('#version').value,status:$('#status').value};$('#saveMsg').textContent='שומר…';try{await api('apps',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:a.clientId,name,redirectUris,details})});$('#saveMsg').textContent='השינויים נשמרו בהצלחה.';await loadApps(true);}catch(e){$('#saveMsg').textContent=e.message;}}
async function loadHistory(){const box=$('#history');box.innerHTML='<p class="muted">טוען היסטוריה…</p>';try{const d=await api('history&client_id='+encodeURIComponent(selected.clientId));box.innerHTML='<div class="section-title">History</div>'+(d.history.length?d.history.map(x=>`<div class="history-row">${esc(x.event)} · ${new Date(x.createdAt).toLocaleString('he-IL')}</div>`).join(''):'<p class="muted">אין אירועים.</p>');}catch(e){box.textContent=e.message}}
function selectApp(id){selected=apps.find(x=>x.clientId===id)||null;if(!selected)return;renderApps();renderEditor(selected)}
$('#createForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);$('#createMsg').textContent='יוצר…';try{const d=await api('apps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),redirectUris:String(f.get('redirect')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)})});const c=d.client;$('#createMsg').innerHTML='נוצר בהצלחה. העתק ושמור את ה־Client Secret עכשיו.';const secret=document.createElement('div');secret.className='secret';secret.innerHTML=`<b>Credentials · מוצגים פעם אחת בלבד</b><p>Client ID</p><div class="mono">${esc(c.clientId)}</div><button class="secondary" id="copyId">העתקת Client ID</button><p>Client Secret</p><div class="mono">${esc(c.clientSecret)}</div><button class="primary" id="copySecret">העתקת Client Secret</button>`;$('#createMsg').after(secret);$('#copyId').onclick=()=>navigator.clipboard.writeText(c.clientId);$('#copySecret').onclick=()=>navigator.clipboard.writeText(c.clientSecret);e.currentTarget.reset();await loadApps(false);selectApp(c.clientId);}catch(err){$('#createMsg').textContent=err.message}};
loadApps(false).catch(e=>{$('#apps').innerHTML=`<div class="empty">${esc(e.message)} · יש להתחבר לחשבון Retzef Brain.</div>`});
</script></body></html>
