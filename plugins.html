<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>Retzef Brain · Plugins</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{color-scheme:dark;--bg:#080b14;--panel:#101727;--line:#25334b;--muted:#9aa9c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#39276b66,transparent 42%),var(--bg);color:#f4f6ff;font-family:Heebo,Arial,sans-serif}main{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;margin-bottom:35px}.brand{font-weight:900;font-size:20px;color:white;text-decoration:none}.brand span,a{color:#b9a8ff}.hero h1{font-size:42px;margin:8px 0}.muted{color:var(--muted);line-height:1.8}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.plugin{padding:14px;border:1px solid var(--line);border-radius:13px;margin:10px 0;background:#0b1220}.plugin h3{margin:0 0 4px}.plugin p,.hint{color:var(--muted);font-size:13px}.field{width:100%;background:#090f1b;color:white;border:1px solid var(--line);border-radius:10px;padding:11px;margin:7px 0 12px;font:inherit}textarea.field{min-height:150px}button{border:0;border-radius:10px;padding:11px 18px;background:linear-gradient(120deg,#7655d9,#367f91);color:white;font:inherit;font-weight:700}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#090f1b;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:90px;margin-top:14px}@media(max-width:700px){main{padding:16px}.layout{grid-template-columns:1fr}.hero h1{font-size:34px}}</style></head><body><main><header class="top"><a class="brand" href="/">RETZEF <span>BRAIN</span></a><a href="/">חזרה למוח ←</a></header><section class="hero"><div style="color:#66e5e0;font-weight:800">RETZEF PLUGIN SYSTEM</div><h1>מרכז התוספים</h1><p class="muted">התוספים מופעלים בצד השרת מתוך רשימה מאושרת. טיוטות חדשות אינן מריצות קוד עד לבדיקה ואישור.</p></section><div class="layout"><section class="panel"><h2>תוספים זמינים</h2><div id="pluginList" class="muted">טוען…</div></section><section class="panel"><h2>הפעלת תוסף</h2><label for="pluginSelect">בחירת תוסף</label><select id="pluginSelect" class="field"></select><label for="pluginInput">קלט JSON</label><textarea id="pluginInput" class="field" spellcheck="false">{ "expression": "12 * (3 + 4)" }</textarea><p class="hint">בחירת תוסף תציג דוגמת קלט.</p><button id="runPlugin">הפעל תוסף</button><div id="pluginResult" class="result" aria-live="polite">התוצאה תופיע כאן.</div></section></div></main><script src="/plugins-ui.js"></script></body></html>
