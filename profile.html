<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0d18"><title>הפרופיל שלי · Retzef Brain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#28336a 0,transparent 48%),#090c16;color:#f5f6ff;font-family:Heebo,Arial,sans-serif;padding:24px}
    .top{max-width:900px;margin:0 auto 34px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:.08em}.brand b{color:#a7adff}.back{color:#d9ddff;text-decoration:none;border:1px solid #343d5c;border-radius:12px;padding:9px 14px;background:#151b2c}
    main{max-width:620px;margin:0 auto}.eyebrow{color:#9da9ff;font-size:11px;letter-spacing:.18em;font-weight:800}.card{margin-top:12px;padding:clamp(22px,5vw,38px);border:1px solid #ffffff1c;border-radius:25px;background:linear-gradient(145deg,#171e34f5,#101525f7);box-shadow:0 28px 90px #0006}
    h1{font-size:clamp(28px,6vw,40px);margin:6px 0 24px}.identity{display:flex;align-items:center;gap:20px;padding-bottom:25px;border-bottom:1px solid #ffffff18}.avatar-wrap{position:relative;width:108px;height:108px;flex:0 0 108px}.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#6878ff,#a05de6);border:3px solid #a8b0ff}.avatar-placeholder{display:grid;place-items:center;font-size:46px}.identity h2{font-size:22px;margin:0 0 3px}.identity p{margin:0;color:#9da8c5;font-size:14px}.details{display:grid;gap:13px;margin:24px 0}.detail{padding:14px 16px;background:#0c1222;border:1px solid #ffffff12;border-radius:13px}.detail small{display:block;color:#8793b5;font-size:11px;margin-bottom:4px}.detail strong{font-size:15px;overflow-wrap:anywhere}
    .actions{display:flex;flex-wrap:wrap;gap:10px}.btn{border:0;border-radius:12px;padding:13px 18px;font:700 14px Heebo;cursor:pointer}.primary{background:linear-gradient(100deg,#6574ff,#925cf1);color:#fff}.secondary{background:#202943;color:#e5e8ff;border:1px solid #3b4669}.status{min-height:24px;color:#aeb8d5;font-size:13px;margin:14px 0 0}.status.error{color:#ffaaaa}.status.success{color:#8de2b4}.hint{color:#7f8aa9;font-size:12px;line-height:1.7;margin-top:20px}
    @media(max-width:480px){body{padding:16px}.identity{align-items:flex-start;gap:15px}.avatar-wrap{width:82px;height:82px;flex-basis:82px}.avatar-placeholder{font-size:36px}.actions .btn{flex:1}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">RETZEF <b>BRAIN</b></a><a class="back" href="/">← חזרה לאזור העבודה</a></header>
  <main><div class="eyebrow">RETZEF ACCOUNT</div><section class="card">
    <h1>הפרופיל שלי</h1>
    <div class="identity"><div class="avatar-wrap"><img id="profileAvatar" class="avatar avatar-placeholder" alt="תמונת הפרופיל" src=""></div><div><h2 id="profileDisplayName">טוען פרופיל…</h2><p id="profileUsername"></p></div></div>
    <div class="details"><div class="detail"><small>שם משתמש</small><strong id="detailUsername">—</strong></div><div class="detail"><small>שם לתצוגה</small><strong id="detailDisplayName">—</strong></div></div>
    <input id="profileFile" type="file" accept="image/*" hidden>
    <div class="actions"><button class="btn primary" id="changePhoto" type="button">📷 שינוי תמונת פרופיל</button><button class="btn secondary" id="logout" type="button">התנתקות</button></div>
    <p class="status" id="status" role="status" aria-live="polite"></p><p class="hint">התמונה נשמרת בחשבון שלך ותופיע ליד השם שלך באזור העבודה.</p>
  </section></main>
  <script src="/profile.js" defer></script>
</body></html>
